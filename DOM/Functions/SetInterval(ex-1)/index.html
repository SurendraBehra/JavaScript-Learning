<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
</head>

<body>
    <button class="finish">start</button>
    <script>
        const finished = document.querySelector(".finish");
        finished.addEventListener('click', () => {
            setInterval(() => {
                finished.innerHTML = `finished!`;
            }, 1000);
        });
    </script>
</body>

</html>
