<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <button class="" onclick="display();">Add to cart</button>
    <p class="message"></p>

    <script>function display() {

            setTimeout(function () {

            }, 2000);
        }
    </script>
    
</body>
